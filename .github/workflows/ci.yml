name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install system dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git rustup pkgconf clang ripgrep
          gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad
          gst-plugins-ugly gst-libav
          gst-plugin-isobmff

      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy

      - name: Verify GStreamer runtime
        run: ./scripts/check-runtime.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test all targets
        run: cargo test --all-targets --locked

      - name: Build release binary and library
        run: cargo build --release --all-targets --locked

      - name: Verify crate package
        run: cargo package --locked

  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GSTREAMER_VERSION: 1.28.6
      GSTREAMER_ROOT: C:\gstreamer
    steps:
      - uses: actions/checkout@v6

      - name: Install official GStreamer SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "gstreamer.exe"
          $uri = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/TYPE=devel",
            "/CURRENTUSER",
            "/VERYSILENT",
            "/NORESTART",
            "/DIR=$env:GSTREAMER_ROOT"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GStreamer installer exited with $($process.ExitCode)"
          }
          "$env:GSTREAMER_ROOT\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$env:GSTREAMER_ROOT\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy

      - name: Verify GStreamer runtime
        shell: pwsh
        run: |
          gst-inspect-1.0 --version
          @("cmafmux", "h264timestamper", "x264enc", "avdec_h264", "avenc_aac") | ForEach-Object {
            gst-inspect-1.0 $_ | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Missing GStreamer element: $_" }
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test all targets
        run: cargo test --all-targets --locked

      - name: Build release binary and library
        run: cargo build --release --all-targets --locked

  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GSTREAMER_VERSION: 1.28.6
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.96.1

      - name: Resolve Android NDK
        run: |
          ndk_root="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -x "$ndk_root/ndk-build"
          echo "AIR_NDK_ROOT=$ndk_root" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          path: .ci/downloads/gstreamer-android-${{ env.GSTREAMER_VERSION }}.tar.xz
          key: gstreamer-android-${{ env.GSTREAMER_VERSION }}

      - name: Download official GStreamer Android SDK
        run: |
          mkdir -p .ci/downloads
          archive=".ci/downloads/gstreamer-android-$GSTREAMER_VERSION.tar.xz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 \
              --output "$archive" \
              "https://gstreamer.freedesktop.org/data/pkg/android/$GSTREAMER_VERSION/gstreamer-1.0-android-universal-$GSTREAMER_VERSION.tar.xz"
          fi

      - name: Extract arm64 SDK
        run: |
          mkdir -p .ci/gstreamer-android
          if [[ ! -f .ci/gstreamer-android/arm64/lib/pkgconfig/gstreamer-1.0.pc ]]; then
            tar -xJf ".ci/downloads/gstreamer-android-$GSTREAMER_VERSION.tar.xz" \
              -C .ci/gstreamer-android arm64
          fi

      - name: Build and link Android runtime
        env:
          ANDROID_NDK_HOME: ${{ env.AIR_NDK_ROOT }}
          GSTREAMER_ROOT_ANDROID: ${{ github.workspace }}/.ci/gstreamer-android
        run: ./scripts/build-android.sh

      - uses: actions/upload-artifact@v6
        with:
          name: air-transcode-android-arm64
          retention-days: 7
          path: |
            target/android-rust/aarch64-linux-android/release/air-transcode
            target/android-gstreamer/arm64-v8a/libs/arm64-v8a/libgstreamer_android.so
            target/android-gstreamer/arm64-v8a/libs/arm64-v8a/libc++_shared.so
