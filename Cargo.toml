[package]
name = "air-transcode"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A high-performance GStreamer-only HTTP VOD transmuxing and transcoding server"
license = "MIT"
repository = "https://github.com/get-air/transcode"
keywords = ["gstreamer", "hls", "cmaf", "transcoding", "streaming"]
categories = ["multimedia::video", "web-programming::http-server"]

[lib]
name = "air_transcode"
path = "src/lib.rs"

[[bin]]
name = "air-transcode"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.4", features = ["http2", "json", "macros", "tokio"] }
bytes = "1.10.1"
clap = { version = "4.5.46", features = ["derive", "env"] }
dashmap = "6.1.0"
futures-util = "0.3.31"
gstreamer = { version = "0.25.0", features = ["v1_28"] }
gstreamer-pbutils = { version = "0.25.0", features = ["v1_28"] }
http = "1.3.1"
mime = "0.3.17"
parking_lot = "0.12.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "cors", "request-id", "sensitive-headers", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
proptest = "1.7.0"
reqwest = { version = "0.12.23", default-features = false, features = ["http2", "json", "rustls-tls"] }
tower = { version = "0.5.2", features = ["util"] }


[[bench]]
name = "manifest"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
